name: Zafer günlük klip

on:
  schedule:
    # İstanbul saatiyle 09:30, 11:30 ve 16:30'da başlar; klipler 10:00, 12:00 ve 17:00'ye hazır olur.
    - cron: "30 6 * * *"
    - cron: "30 8 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Hangi saat için (1000, 1200, 1700)"
        required: false
        default: "1000"

permissions:
  contents: write

concurrency:
  group: zafer-klip
  cancel-in-progress: false

jobs:
  klip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Araçları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r zafer-otomasyon/requirements.txt

      - name: YouTube çerezleri (isteğe bağlı)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"

      - name: Klip hazırla
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_COOKIES_FILE: ${{ runner.temp }}/cookies.txt
          SLOT: ${{ inputs.slot }}
        run: python zafer-otomasyon/pipeline.py

      - name: Depoya kaydet
        run: |
          git config user.name "zafer-bot"
          git config user.email "zafer-bot@users.noreply.github.com"
          git add zafer-klipler
          git diff --cached --quiet && exit 0
          git commit -m "Zafer klipleri: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
